operators:
  cernet:
    country: 'CN'
    pattern: '(cngi|cernet)'
  china:
    country: 'CN'
    pattern: ''
    origin_only: true
    trusted_transit_operators:
      - 'chinanet'
      - 'cmcc'
      - 'unicom'
      - 'cstnet'
      - 'cernet'
    # AS142111 has trusted domestic paths but originates known foreign prefixes.
    exclude_asn:
      - '142111'
    registry_fallback_country: 'CN'
  chinanet:
    country: 'CN'
    pattern: '(china ?telecom|chinanet|AS4847 )'
  cmcc:
    country: 'CN'
    pattern: '(china mobile|cmnet|tietong|CHINA RAILWAY)'
  cstnet:
    country: 'CN'
    pattern: 'cstnet'
  drpeng:
    country: 'CN'
    pattern: '(dxtnet|dr.?peng|gxblnet|xirang)'
  googlecn:
    country: 'CN'
    pattern: 'AS24424'
  unicom:
    country: 'CN'
    pattern: '(unicom|cnc)'
