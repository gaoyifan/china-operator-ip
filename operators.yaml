operators:
  cernet:
    country: 'CN'
    # CNGI also includes commercial operators; AS23911 is CERNET's Beijing IX.
    pattern: '(cernet|^AS23911\b)'
  china:
    country: 'CN'
    pattern: ''
    origin_only: true
    trusted_transit_operators:
      - 'chinanet'
      - 'cmcc'
      - 'unicom'
      - 'cstnet'
      - 'cernet'
    # AS142111 has trusted domestic paths but originates known foreign prefixes.
    exclude_asn:
      - '142111'
    # Alibaba's Singapore range; retain other prefixes originated by AS45102.
    # https://ipinfo.io/ips/47.236.0.0/16
    exclude_prefixes:
      - '47.236.0.0/16'
    registry_fallback_country: 'CN'
  chinanet:
    country: 'CN'
    pattern: '(china ?telecom|chinanet|^AS(4847|38035|38270)\b)'
    # The legacy CHINANET description of AS18344 refers to a Unicom network.
    exclude_asn:
      - '18344'
  cmcc:
    country: 'CN'
    pattern: '(china mobile|cmnet|tietong|CHINA RAILWAY)'
  cstnet:
    country: 'CN'
    pattern: 'cstnet'
  drpeng:
    country: 'CN'
    pattern: '(dxtnet|dr.?peng|gxblnet|xirang)'
  googlecn:
    country: 'CN'
    pattern: 'AS24424'
  unicom:
    country: 'CN'
    pattern: '(unicom|cnc)'
